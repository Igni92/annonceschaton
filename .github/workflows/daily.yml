name: Rapport quotidien chatons

on:
  schedule:
    # 06:00 UTC = 08:00 Paris (heure d'été) / 07:00 Paris (heure d'hiver)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annonceschaton-daily
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configuration
        run: |
          if [ ! -f config.json ]; then cp config.example.json config.json; fi

      - name: Exécution du bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNONCES_VILLE: ${{ vars.ANNONCES_VILLE }}
          ANNONCES_CODE_POSTAL: ${{ vars.ANNONCES_CODE_POSTAL }}
          ANNONCES_RAYON_KM: ${{ vars.ANNONCES_RAYON_KM }}
          ANNONCES_ZONE_MODE: ${{ vars.ANNONCES_ZONE_MODE }}
          ANNONCES_DEPARTEMENTS: ${{ vars.ANNONCES_DEPARTEMENTS }}
          ANNONCES_AGE_MAX_MOIS: ${{ vars.ANNONCES_AGE_MAX_MOIS }}
          ANNONCES_NOUVEAUX_JOURS: ${{ vars.ANNONCES_NOUVEAUX_JOURS }}
        run: node src/index.js --quiet

      - name: Publier le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Mémoriser l'état et le dernier rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json reports/latest.md reports/latest.json
          git diff --cached --quiet && echo "Rien à mémoriser." && exit 0
          git commit -m "chore: rapport du $(date -u +%Y-%m-%d)"
          git push
